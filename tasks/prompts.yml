---
# Prompt for missing required variables and compute derived values

- name: Prompt for username if not provided
  pause:
    prompt: "Enter Linux username"
  register: username_prompt
  when: username == ""

- name: Set username from prompt
  set_fact:
    username: "{{ username_prompt.user_input }}"
  when: username_prompt is changed

- name: Prompt for linux_password if not provided
  pause:
    prompt: "Enter Linux password"
    echo: no
  register: linux_password_prompt
  when: linux_password == ""

- name: Set linux_password from prompt
  set_fact:
    linux_password: "{{ linux_password_prompt.user_input }}"
  when: linux_password_prompt is changed

- name: Prompt for project_name if not provided
  pause:
    prompt: "Enter project name"
  register: project_name_prompt
  when: project_name == ""

- name: Set project_name from prompt
  set_fact:
    project_name: "{{ project_name_prompt.user_input }}"
  when: project_name_prompt is changed

- name: Prompt for domain if not provided
  pause:
    prompt: "Enter domain name"
  register: domain_prompt
  when: domain == ""

- name: Set domain from prompt
  set_fact:
    domain: "{{ domain_prompt.user_input }}"
  when: domain_prompt is changed

- name: Prompt for mysql_password if not provided
  pause:
    prompt: "Enter MySQL password"
    echo: no
  register: mysql_password_prompt
  when: mysql_password == ""

- name: Set mysql_password from prompt
  set_fact:
    mysql_password: "{{ mysql_password_prompt.user_input }}"
  when: mysql_password_prompt is changed

# === Compute derived variables ===

- name: Set mysql_db_name to default if empty
  set_fact:
    mysql_db_name: "{{ mysql_db_name if mysql_db_name else (project_name | replace('-', '_') ~ '_db') }}"

- name: Set mysql_user_name to default if empty
  set_fact:
    mysql_user_name: "{{ mysql_user_name if mysql_user_name else (username | replace('-', '_')) }}"

- name: Set derived variables
  set_fact:
    user_home: "/home/{{ username }}"
    project_dir: "/var/www/{{ project_name }}"
    vhost_conf: "{{ '/etc/apache2/sites-available/' ~ domain ~ '.conf' if web_server == 'apache2' else '/etc/nginx/sites-available/' ~ domain ~ '.conf' }}"
    mysql_db: "{{ mysql_db_name }}"
    mysql_user: "{{ mysql_user_name }}"
    web_root: "{{ '/var/www/' ~ project_name ~ '/public' if is_laravel | default(false) | bool else '/var/www/' ~ project_name }}"
