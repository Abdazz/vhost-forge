---
# Prompt for missing required variables and compute derived values

- name: Prompt for server_username if not provided
  pause:
    prompt: "Enter server (Linux) username"
  register: server_username_prompt
  when: server_username == ""

- name: Set server_username from prompt
  set_fact:
    server_username: "{{ server_username_prompt.user_input }}"
  when: server_username_prompt is changed

- name: Prompt for server_password if not provided
  pause:
    prompt: "Enter server (Linux) password"
    echo: no
  register: server_password_prompt
  when: server_password == ""

- name: Set server_password from prompt
  set_fact:
    server_password: "{{ server_password_prompt.user_input }}"
  when: server_password_prompt is changed

- name: Prompt for project_name if not provided
  pause:
    prompt: "Enter project name"
  register: project_name_prompt
  when: project_name == ""

- name: Set project_name from prompt
  set_fact:
    project_name: "{{ project_name_prompt.user_input }}"
  when: project_name_prompt is changed

- name: Prompt for domain if not provided
  pause:
    prompt: "Enter domain name"
  register: domain_prompt
  when: domain == ""

- name: Set domain from prompt
  set_fact:
    domain: "{{ domain_prompt.user_input }}"
  when: domain_prompt is changed

- name: Prompt for mysql_user_password if not provided
  pause:
    prompt: "Enter MySQL user password"
    echo: no
  register: mysql_user_password_prompt
  when: mysql_user_password == ""

- name: Set mysql_user_password from prompt
  set_fact:
    mysql_user_password: "{{ mysql_user_password_prompt.user_input }}"
  when: mysql_user_password_prompt is changed

# === Compute derived variables ===

- name: Set mysql_database to default if empty
  set_fact:
    mysql_database: "{{ mysql_database if mysql_database else (project_name | replace('-', '_') ~ '_db') }}"

- name: Set mysql_username to default if empty
  set_fact:
    mysql_username: "{{ mysql_username if mysql_username else (server_username | replace('-', '_')) }}"

- name: Set derived variables
  set_fact:
    user_home: "/home/{{ server_username }}"
    project_dir: "/var/www/{{ project_name }}"
    vhost_conf: "{{ '/etc/apache2/sites-available/' ~ domain ~ '.conf' if web_server == 'apache2' else '/etc/nginx/sites-available/' ~ domain ~ '.conf' }}"
    web_root: "{{ '/var/www/' ~ project_name ~ '/public' if is_laravel | default(false) | bool else '/var/www/' ~ project_name }}"
