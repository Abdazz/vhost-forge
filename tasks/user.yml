---
# Create Linux user with sudo access

- name: Create Linux user
  user:
    name: "{{ server_username }}"
    home: "{{ user_home }}"
    shell: /bin/bash
    state: present

- name: Add user to sudo group
  user:
    name: "{{ server_username }}"
    groups: sudo
    append: yes

- name: Set user password
  user:
    name: "{{ server_username }}"
    password: "{{ server_password | password_hash('sha512') }}"
    update_password: always

- name: Display user creation info
  debug:
    msg: "✅ Linux user '{{ server_username }}' created/updated."
