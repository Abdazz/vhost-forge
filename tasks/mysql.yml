---
# Create MySQL/MariaDB database and user

- name: Install MariaDB client
  apt:
    name: mariadb-client
    state: present

- name: Install Python MySQL module
  apt:
    name: python3-pymysql
    state: present

- name: Ensure MariaDB service is started
  service:
    name: mariadb
    state: started
    enabled: yes

- name: Check if MySQL database exists
  mysql_query:
    query: "SHOW DATABASES LIKE '{{ mysql_database }}'"
    login_unix_socket: /var/run/mysqld/mysqld.sock
  register: db_exists
  ignore_errors: yes

- name: Create MySQL database
  mysql_query:
    query: "CREATE DATABASE {{ mysql_database }} CHARACTER SET utf8mb4 COLLATE utf8mb4_unicode_ci"
    login_unix_socket: /var/run/mysqld/mysqld.sock
  when: db_exists.query_result[0] | length == 0

- name: Create MySQL user and grant privileges
  mysql_user:
    name: "{{ mysql_username }}"
    password: "{{ mysql_user_password }}"
    host: localhost
    priv: "{{ mysql_database }}.*:ALL"
    state: present
    login_unix_socket: /var/run/mysqld/mysqld.sock

- name: Display MySQL info
  debug:
    msg: "✅ MySQL database '{{ mysql_database }}' and user '{{ mysql_username }}' ready."
